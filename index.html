<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="styles/theme-classic.css">
</head>
<body>
    <div class="container app header">
        <h1>Tic Tac Toe</h1>
        <div class="status-display status" id="status">Player X's Turn</div>
        <div class="game-board board" id="gameBoard">
            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>
            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>
            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>
        </div>
        <button class="reset-btn btn" id="resetBtn">Reset Game</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
